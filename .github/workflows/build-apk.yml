name: Build TorChatto APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS deps
        run: npm install

      - name: Preserve native plugin
        run: |
          mkdir -p /tmp/torchatto-native-src
          cp -r android/app/src/main/java/com/torchat /tmp/torchatto-native-src/ || true

      - name: Add Android platform
        run: npx cap add android

      - name: Restore plugin sources
        run: |
          mkdir -p android/app/src/main/java/com/torchat
          cp -f /tmp/torchatto-native-src/com/torchat/*.java android/app/src/main/java/com/torchat/ || true

      - name: Sync web assets
        run: npx cap sync android

      - name: Wire TorPlugin
        run: |
          GEN_MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n1)
          echo "MainActivity at: $GEN_MAIN"
          GEN_PKG=$(grep -m1 '^package ' "$GEN_MAIN" | sed 's/package //; s/;//')
          cat > "$GEN_MAIN" <<EOF
          package ${GEN_PKG};
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import com.torchat.TorPlugin;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(TorPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Add tor-android dependency
        run: |
          python3 << 'PYEOF'
          import pathlib
          repo_line = "        maven { url 'https://raw.githubusercontent.com/guardianproject/gpmaven/master' }\n"
          dep_lines = "    implementation 'info.guardianproject:tor-android:0.4.8.11'\n    implementation 'info.guardianproject:jtorctl:0.4.5.7'\n"
          patched=False
          for path in ["settings.gradle", "android/build.gradle"]:
              p=pathlib.Path(path)
              if not p.exists(): continue
              text=p.read_text()
              if "gpmaven" in text:
                  patched=True; break
              if "mavenCentral()" in text:
                  text=text.replace("mavenCentral()", "mavenCentral()\n"+repo_line, 1)
                  p.write_text(text); patched=True; break
          if not patched:
              p=pathlib.Path("android/build.gradle")
              existing=p.read_text() if p.exists() else ""
              existing+="\nallprojects {\n    repositories {\n"+repo_line+"    }\n}\n"
              p.write_text(existing)
          app_gradle=pathlib.Path("android/app/build.gradle")
          text=app_gradle.read_text()
          if "tor-android" not in text:
              if "dependencies {" in text:
                  text=text.replace("dependencies {", "dependencies {\n"+dep_lines, 1)
              else:
                  text+="\ndependencies {\n"+dep_lines+"}\n"
              app_gradle.write_text(text)
          PYEOF

      - name: Ensure INTERNET permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' "$MANIFEST" || true
            sed -i '0,/<application/s##<uses-permission android:name="android.permission.INTERNET" \/>\n\n    <application#' "$MANIFEST"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TorChatto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
