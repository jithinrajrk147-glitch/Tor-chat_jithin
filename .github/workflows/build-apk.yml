name: Build TorChatto APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS deps
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Copy TorPlugin to Android package
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/torchat
          cp TorPlugin.java android/app/src/main/java/com/torchat/
          echo "Copied TorPlugin.java to android/app/src/main/java/com/torchat/"

      - name: Sync web assets
        run: npx cap sync android

      - name: Wire TorPlugin into MainActivity
        shell: bash
        run: |
          GEN_MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          if [ -z "$GEN_MAIN" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi
          echo "Found MainActivity at: $GEN_MAIN"
          
          GEN_PKG=$(grep -m1 '^package ' "$GEN_MAIN" | sed 's/^package //; s/;//')
          echo "Package: $GEN_PKG"
          
          cat > "$GEN_MAIN" <<'EOF'
          package ${PKG_NAME};
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import com.torchat.TorPlugin;
          
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(TorPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          
          sed -i "s/\${PKG_NAME}/${GEN_PKG}/g" "$GEN_MAIN"
          echo "MainActivity updated with TorPlugin registration"

      - name: Add tor-android dependency
        shell: bash
        run: |
          python3 <<'PYEOF'
          import pathlib
          
          repo_line = "        maven { url 'https://raw.githubusercontent.com/guardianproject/gpmaven/master' }\n"
          dep_lines = (
              "    implementation 'info.guardianproject:tor-android:0.4.8.11'\n"
              "    implementation 'info.guardianproject:jtorctl:0.4.5.7'\n"
          )
          
          patched = False
          for rel in ["settings.gradle", "android/build.gradle"]:
              p = pathlib.Path(rel)
              if not p.exists():
                  continue
              text = p.read_text()
              if "gpmaven" in text:
                  patched = True
                  break
              if "mavenCentral()" in text:
                  text = text.replace("mavenCentral()", "mavenCentral()\n" + repo_line, 1)
                  p.write_text(text)
                  patched = True
                  break
          
          if not patched:
              p = pathlib.Path("android/build.gradle")
              existing = p.read_text() if p.exists() else ""
              existing += "\nallprojects {\n    repositories {\n" + repo_line + "    }\n}\n"
              p.write_text(existing)
          
          app_gradle = pathlib.Path("android/app/build.gradle")
          text = app_gradle.read_text()
          if "tor-android" not in text:
              if "dependencies {" in text:
                  text = text.replace("dependencies {", "dependencies {\n" + dep_lines, 1)
              else:
                  text += "\ndependencies {\n" + dep_lines + "}\n"
              app_gradle.write_text(text)
          PYEOF

      - name: Ensure INTERNET permission
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' "$MANIFEST" || true
            sed -i '0,/<application/s#<application#<uses-permission android:name="android.permission.INTERNET" />\n\n    <application#' "$MANIFEST" || true
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TorChatto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
